<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QYAARO AI – yaaron ka yaar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1430">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{--o1:#fff3e4;--o2:#ffb347;--o3:#ff7a90;--glow:rgba(255,122,144,.45);--bg:#1e1430;--panel:#2a1c42;--ink:#fff3e4;--mute:#bfa9d6;--gold:#ffb347;--rose:#ff7a90;--me:#ffb347;--meink:#2a1500}
@media (prefers-color-scheme:light){:root{--bg:#fff3e4;--panel:#ffe5c7;--ink:#2a1c42;--mute:#6d5a85;--meink:#2a1500}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{text-align:center;padding:20px 16px 8px}
.orb{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--o1),var(--o2) 40%,var(--o3) 80%);box-shadow:0 0 50px 8px var(--glow);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07);box-shadow:0 0 70px 14px var(--glow)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
h1{font:800 34px/1 Fraunces,Georgia,serif;letter-spacing:.04em;margin:0}
header p{margin:6px 0 0;color:var(--mute);font-size:15px;max-height:40px;overflow:hidden;transition:opacity .3s,max-height .3s,margin .3s}
header{transition:padding .3s}
.orb{transition:width .35s,height .35s,margin .35s}
h1{transition:font-size .35s}
body.compact header{padding:10px 16px 4px}
body.compact .orb{width:44px;height:44px;margin-bottom:4px}
body.compact h1{font-size:20px}
body.compact header p{opacity:0;max-height:0;margin:0}
#chat{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-width:640px;width:100%;margin:0 auto}
.m{max-width:82%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--panel);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--me);color:var(--meink);align-self:flex-end;border-bottom-right-radius:4px}
form{display:flex;gap:8px;padding:10px 14px 14px;max-width:640px;width:100%;margin:0 auto}
input{flex:1;min-width:0;padding:13px 16px;border-radius:999px;border:2px solid transparent;background:var(--panel);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{border:0;border-radius:999px;padding:0 20px;background:var(--gold);color:var(--meink);font:700 16px inherit;cursor:pointer}
.clear{background:none;color:var(--mute);font-size:13px;font-weight:400;padding:0 0 8px;display:block;margin:0 auto;text-decoration:underline}
.rk{display:inline-block;padding:2px 12px;border-radius:999px;font-weight:700;margin-bottom:2px}
.rz{background:#e0344a;color:#fff}
.rm{background:#ff9f45;color:#2a1500}
.rl{background:#5ad19a;color:#062b1c}
.fb{margin-top:6px;display:flex;gap:4px}
.fb button{background:none;border:1px solid var(--mute);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:15px;line-height:1.4;cursor:pointer}
.fb button[disabled]{opacity:.5;cursor:default}
.fb button.on{background:var(--gold);color:var(--meink);border-color:var(--gold);opacity:1}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;padding:0 14px}
#guard{color:var(--gold);text-decoration:none;font-weight:600;border:1px solid var(--gold);border-radius:999px;padding:3px 12px 4px;margin:0 0 8px}
body.guard #guard{background:var(--gold);color:var(--meink)}
body.guard input{border-color:var(--gold)}
</style>
</head>
<body>
<header>
  <div class="orb" id="orb" aria-hidden="true"></div>
  <h1>QYAARO</h1>
  <p>Yaaron ka yaar. Chai pe charcha jaisa dost.</p>
</header>
<main id="chat" aria-live="polite"></main>
<div class="row">
  <button class="clear" id="clear" type="button">Chat saaf</button>
  <button class="clear" id="guard" type="button">🛡️ Suraksha jaanch</button>
  <button class="clear" id="fbexport" type="button">Feedback copy</button>
</div>
<form id="f">
  <input id="t" placeholder="Kuch bhi bol yaar…" autocomplete="off" aria-label="Message">
  <button type="submit">Bhejo</button>
</form>

<script>
/* ---- SETTINGS ---- */
// Jab aap AI ka asli dimaag (Cloudflare Worker) jodoge, uska link yahan daalna.
var API_URL = "https://qyaaro-chat.aryan3765955.workers.dev";
var BOT = "QYAARO";
var SYSTEM = "Tum QYAARO ho: 'yaaron ka yaar'. Tumhari pehchaan: mohalle ka wo samajhdaar dost jo seedhi, sachchi baat karta hai. Andaaz: garam, thoda mazaakiya, kabhi bhashan ya lecture nahi. Bhasha: Hinglish (Roman Hindi + English). User ka ling (ladka/ladki) kabhi andaaza mat lagao: 'bhai', 'behen', 'beta' mat bolo aur user ke liye aise kriya mat use karo jisme ling dikhe (jaise 'kar rahi hai' ya 'kar raha hai'). Sirf 'yaar' ya naam bolo, aur 'tum'/'tu' se baat karo; jaise 'kya hua?', 'bata na', 'kitna gussa aaya hoga'. Kriya aise rakho jisme ling na dikhe: 'tu aaj ka din shuru kar raha hai' galat hai, 'aaj ka din kaisa chal raha hai?' sahi hai; 'chahta/chahti' kabhi mat likho, 'chahiye' likho. Har jawab mein pehle user ki baat ya feeling ek chhoti line mein pakdo, phir kaam ki baat. Har jawab ki shuruaat alag rakho: har baar user ka naam ya 'lagta hai' se shuru mat karo. Chai ka zikr ya desi kahawat bahut kam: 6-7 jawab mein sirf ek baar, aur kabhi nahi jab user udaas, pareshan ya gusse mein ho. Emoji kam, ek se zyada nahi. Sawalon ka sahi aur kaam ka jawab do, andaaze se ya jhooth mat bolo; pata na ho to seedha bol do. Agar kisi shabd ke do matlab ho sakte hon (jaise Cloud/Claude, Java, Python), to pehle ek chhota sawaal poochho. Jawab chhote rakho (3-5 line) jab tak user detail na maange. Ek baar mein sirf ek sawaal poochho. Jab user udaas, pareshan ya gusse mein ho: pehle dhyan se suno aur bolo ki tum yahin ho; salah ya list mat do jab tak wo na maange; bas ek narm sawaal poochho jaise 'kya hua?'. Helpline sirf tab batao jab baat sach mein gambhir ho: jaise user kahe ki jeena nahi chahta, khud ko nuksan pahunchana chahta hai, ya bilkul toot chuka hai. Tab pyaar se bolo ki akela nahi hai, kisi bharosemand insaan se abhi baat kare, aur India mein Tele-MANAS 14416 par call kar sakta hai. Roz ki udaasi ya gusse par helpline ka naam mat lo. Agar user kisi shak wale call, link, OTP ya paise ki maang ki baat kare, to pehle shaant lehje mein ek chhoti chetavni do (OTP/PIN/CVV kisi ko nahi, anjaan link par click nahi) aur kaho ki 'Suraksha jaanch' button se wo sandesh paste karke jaanch le. Bina wajah daraao mat. Agar user bole ki wo abhi kisi khatre mein hai, to turant 112 (emergency) ya paise ke dhokhe mein 1930 (cyber crime helpline) batao. Agar user poochhe ki tum kaun ho: bolo ki tum QYAARO ho, ek AI dost jo ek open-source language model par chalta hai; kisi aur company ka naam ya Claude/ChatGPT hone ka dawa mat karo. User ki pichli baatein yaad rakho.";

/* ---- MEMORY (sirf is phone/browser mein save hoti hai) ---- */
var chat = document.getElementById("chat");
var memory = {name: "", history: []};
try { memory = JSON.parse(localStorage.getItem("qyaaro") || "") || memory; } catch (e) {}
function save() { try { localStorage.setItem("qyaaro", JSON.stringify(memory)); } catch (e) {} }

function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(t) {
  var cls = {ZYADA: "rz", MADHYAM: "rm", KAM: "rl"};
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/Khatra:\s*(ZYADA|MADHYAM|KAM)/g, function (m, lv) { return '<span class="rk ' + cls[lv] + '">Khatra: ' + lv + "</span>"; });
}

function scrollBot(el, who) {
  if (who === "bot" && el.offsetHeight > chat.clientHeight * 0.6) { chat.scrollTop = el.offsetTop - chat.offsetTop - 8; }
  else { chat.scrollTop = chat.scrollHeight; }
}

function add(text, who) {
  var d = document.createElement("div");
  d.className = "m " + who;
  if (who === "bot") d.innerHTML = fmt(text); else d.textContent = text;
  chat.appendChild(d);
  scrollBot(d, who);
  return d;
}

var FB_KEY = "qyaaro_feedback";
function loadFb() { try { return JSON.parse(localStorage.getItem(FB_KEY) || "[]"); } catch (e) { return []; } }
function saveVote(question, answer, vote) {
  var all = loadFb();
  all.push({time: new Date().toISOString(), question: question, answer: answer, vote: vote});
  try { localStorage.setItem(FB_KEY, JSON.stringify(all.slice(-100))); } catch (e) {}
}
function attachFeedback(el, question, answer) {
  var box = document.createElement("div");
  box.className = "fb";
  [["\uD83D\uDC4D", "up"], ["\uD83D\uDC4E", "down"]].forEach(function (b) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = b[0];
    btn.setAttribute("aria-label", b[1] === "up" ? "Achha jawab" : "Bura jawab");
    btn.addEventListener("click", function () {
      saveVote(question, answer, b[1]);
      Array.prototype.forEach.call(box.children, function (x) { x.disabled = true; });
      btn.classList.add("on");
    });
    box.appendChild(btn);
  });
  el.appendChild(box);
}

/* ---- DEMO DIMAAG (jab tak API_URL khali hai) ---- */
function demoReply(text) {
  var low = text.toLowerCase();
  var nm = low.match(/(?:mera naam|my name is|main)\s+(\w+)/);
  if (nm && /naam|name/.test(low)) { memory.name = nm[1]; return "Achha " + nm[1] + "! Naam yaad kar liya. Ab se main tujhe yahi bulaunga."; }
  if (/hi|hello|hey|namaste/.test(low)) return memory.name ? "Arre " + memory.name + "! Kaisa hai?" : "Hello dost! Tera naam kya hai?";
  if (/kaise|kaisa|how are/.test(low)) return "Main mast hoon. Tu bata, aaj ka din kaisa gaya?";
  if (/udaas|sad|dukhi|tension/.test(low)) return "Main yahin hoon. Dil halka kar le, kya hua? Sab bata de.";
  if (/naam/.test(low) && /mera|mujhe/.test(low) && memory.name) return "Tera naam " + memory.name + " hai, bhoola nahi hoon.";
  return "Samajh raha hoon. Thoda aur bata na? (Abhi main demo mode mein hoon. Asli dimaag jodne ke baad main har sawal ka jawab dunga.)";
}

/* ---- MOOD: orb ka rang user ke mood ke hisaab se ---- */
var MOODS = {
  neutral: {o1:"#fff3e4", o2:"#ffb347", o3:"#ff7a90", glow:"rgba(255,122,144,.45)"},
  khush:   {o1:"#fffbe0", o2:"#ffd24a", o3:"#ff8a5c", glow:"rgba(255,210,74,.6)"},
  udaas:   {o1:"#e4edff", o2:"#7aa2ff", o3:"#8a6cff", glow:"rgba(122,162,255,.5)"},
  gussa:   {o1:"#ffe3d8", o2:"#ff7a45", o3:"#e0344a", glow:"rgba(255,90,70,.55)"},
  thaka:   {o1:"#e8fff4", o2:"#7ad9b0", o3:"#4aa3a0", glow:"rgba(122,217,176,.45)"}
};
var MOOD_RULES = [
  ["udaas", /udaas|dukhi|\bsad\b|rona|ro raha|ro rahi|akela|akeli|tension|depress|dard|toot|bura lag/i],
  ["gussa", /gussa|angry|chidh|irritat|pagal kar|nafrat|bakwas/i],
  ["thaka", /thak|neend|tired|\bbore\b|bore ho/i],
  ["khush", /khush|mast|maza|badhiya|party|congrat|\byay\b|awesome|great|shukriya|thanks/i]
];
var currentMood = "neutral";
function detectMood(text) {
  for (var i = 0; i < MOOD_RULES.length; i++) { if (MOOD_RULES[i][1].test(text)) return MOOD_RULES[i][0]; }
  return "neutral";
}
function setMood(name) {
  currentMood = name;
  var m = MOODS[name] || MOODS.neutral, r = document.documentElement.style;
  r.setProperty("--o1", m.o1); r.setProperty("--o2", m.o2); r.setProperty("--o3", m.o3); r.setProperty("--glow", m.glow);
}

/* ---- SURAKSHA JAANCH ---- */
var GUARD_SYSTEM = "Tum QYAARO ke 'Suraksha jaanch' mode mein ho. User ne koi sandesh, link ya call ki baat bheji hai jispar use shak hai. Jawab ka dhaancha, bilkul isi kram mein: (1) Pehli line sirf: 'Khatra: ZYADA' ya 'Khatra: MADHYAM' ya 'Khatra: KAM'. (2) 'Kyun:' ke neeche zyada se zyada 3 chhote bullet, har ek 12 shabd se kam. (3) 'Abhi kya karo:' ke neeche zyada se zyada 3 chhote kadam. (4) Sirf tab jab paise, OTP ya PIN ka khatra ho: ek line mein batao ki paise ya OTP chale gaye hon to turant bank ko call karke card/UPI block karwao, 1930 (cyber crime helpline) par call karo aur cybercrime.gov.in par shikayat darj karo. Jaan ko khatra ho to 112. (5) Aakhir mein ek chhoti line: 'Ye sirf sanket hain, final faisla aapka.' Mujhe 'Shuruaati sanket' bhi mil sakte hain, unhe shabd-ba-shabd dohrao mat. India ke aam dhokhe dhyan mein rakho: digital arrest (police/CBI ke naam par video call), fake KYC, OTP/UPI PIN maangna, UPI collect request, anjaan APK, loan app, job ya task wala dhokha, lottery, fake customer care number. Zaroori: tum 100% pakka nahi bata sakte, aur kabhi mat kaho ki 'tum bach gaye'. Shak ho to ZYADA ya MADHYAM ki taraf jhuko. Asli bank, police ya company ka official app ya number khud dhoondhne ko kaho, sandesh mein diya number ya link nahi. Bhasha: saaf Hinglish, 'karo', 'mat karo', 'batao' jaise rup (kabhi 'karein', 'karwayen', 'karayein' nahi). 'FIR' mat bolo, 'shikayat' bolo. User ke ling ka andaaza mat lagao. Dhyan rahe ki user dara hua ho sakta hai: shaant aur seedha raho.";
var GUARD_RULES = [
  [/\b(otp|pin|cvv|password|passcode)\b/i, "OTP/PIN/CVV/password kabhi kisi ko mat batao. Asli bank ya police ye nahi maangte."],
  [/(digital arrest|giraftar|arrest|warrant|\bcbi\b|narcotics|customs)/i, "Police/CBI/customs ke naam par darr: asli agency video call par giraftar nahi karti aur paise nahi maangti."],
  [/(kyc|account.{0,15}(band|block|freeze|suspend)|sim.{0,10}(band|block)|bijli.{0,15}(kat|band))/i, "Account/SIM/bijli band hone ki dhamki aksar jhooth hoti hai. Apne official app ya branch se khud check karo."],
  [/(lottery|lucky draw|inaam|prize|cashback|gift card|jeet gaye|jeeta hai)/i, "Muft inaam ya lottery ka sandesh lagbhag hamesha dhokha hota hai."],
  [/(\.apk\b|apk file|app install|install karo|download karo)/i, "Anjaan APK/app install mat karo, isse phone ka control ja sakta hai."],
  [/(bit\.ly|tinyurl|cutt\.ly|t\.co\/|goo\.gl|is\.gd|rb\.gy|shorturl)/i, "Chhote (shortened) link ke peeche asli site chhupi hoti hai. Seedha click mat karo."],
  [/https?:\/\/\S+/i, "Is link ko seedha mat kholo. Site ka asli naam khud type karke jao."],
  [/(collect request|request accept|qr (code )?scan|scan karo|upi pin)/i, "Paise lene ke liye PIN ya QR scan nahi karna padta. UPI PIN sirf paise bhejte waqt apne app mein daalo."],
  [/(work from home|task complete|per day.{0,12}(kamao|earning)|loan (approve|sanction)|processing fee|registration fee)/i, "Pehle paise (fee) maangne wale job ya loan aksar dhokha hote hain."],
  [/(turant|abhi|jaldi|urgent|immediately|last chance|24 ghante).{0,40}(paise|payment|transfer|bhej|pay)/i, "Jaldbaazi ka dabaav dhokhe ka bada sanket hai. Ruko aur kisi bharosemand se pucho."]
];
function guardFlags(text) {
  var out = [];
  for (var i = 0; i < GUARD_RULES.length; i++) { if (GUARD_RULES[i][0].test(text)) out.push(GUARD_RULES[i][1]); }
  return out;
}
var guardOn = false;
function applyGuard(on) {
  guardOn = on;
  document.body.classList.toggle("guard", on);
  document.getElementById("guard").textContent = on ? "\uD83D\uDEE1\uFE0F Band karo" : "\uD83D\uDEE1\uFE0F Suraksha jaanch";
  document.getElementById("t").placeholder = on ? "Shak wala message / link / call ki baat paste karo\u2026" : "Kuch bhi bol yaar\u2026";
}
document.getElementById("guard").addEventListener("click", function () {
  applyGuard(!guardOn);
  if (guardOn) {
    add("\uD83D\uDEE1\uFE0F Suraksha jaanch chalu. Jis sandesh, link ya call par shak hai, wo yahan paste karo. Main sanket dunga, par final faisla aapka hai. Paisa ya OTP dene se pehle ruko.", "bot");
    document.getElementById("t").focus();
  }
});

var justNamed = "";
async function reply(text, useGuard) {
  if (!API_URL) return demoReply(text);
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 25000);
  try {
    var msgs = useGuard ? memory.history.slice(-1) : memory.history.slice(-20);
    var r = await fetch(API_URL, {method: "POST", signal: ctrl.signal, headers: {"Content-Type": "application/json"},
      body: JSON.stringify({system: (useGuard ? GUARD_SYSTEM : SYSTEM) + (memory.name ? " User ka naam " + memory.name + " hai." : " Tum pehle sandesh mein user ka naam poochh chuke ho. Agar user ne abhi tak naam nahi bataya, to ek baar pyaar se dobara poochho (jaise 'naam to bata yaar').") + (justNamed ? " User ne abhi apna naam bataya hai. Naam se garmjoshi se swagat karo (naam ke baare mein sawaal ya jaankari mat do) aur poochho ki aaj kya chal raha hai." : "") + (currentMood !== "neutral" ? " User ka mood abhi: " + currentMood + ". Usi hisaab se narmi ya josh rakho; udaas ya gusse mein pehle sirf suno." : ""), messages: msgs})});
    var raw = await r.text();
    var j;
    try { j = JSON.parse(raw); } catch (e) { return "Server ne ajeeb jawab diya (code " + r.status + "): " + raw.slice(0, 120); }
    return j.reply || "Khali jawab aaya (code " + r.status + ").";
  } catch (e) {
    if (e.name === "AbortError") return "Jawab mein bahut der lag gayi. Dobara try kar.";
    return "Connection error: " + e.message;
  } finally { clearTimeout(timer); }
}

document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var t = document.getElementById("t");
  var text = t.value.trim();
  if (!text) return;
  t.value = "";
  var wasGuard = guardOn;
  var flags = wasGuard ? guardFlags(text) : [];
  var sendText = wasGuard ? "[Suraksha jaanch]\n" + text + (flags.length ? "\n\nShuruaati sanket (code se): " + flags.join("; ") : "") : text;
  var namedNow = "";
  if (!memory.name && !wasGuard) { var nm = extractName(text, memory.history.length < 4); if (nm) { memory.name = nm; namedNow = nm; save(); } }
  add(wasGuard ? "\uD83D\uDEE1\uFE0F " + text : text, "me");
  document.body.classList.add("compact");
  if (!wasGuard) setMood(detectMood(text));
  memory.history.push({role: "user", content: namedNow ? "Mera naam " + namedNow + " hai." : sendText});
  justNamed = namedNow;
  add("QYAARO soch raha hai…", "bot");
  var typing = chat.lastChild;
  if (wasGuard && flags.length) { typing.innerHTML = fmt("\u26A0\uFE0F Turant sanket:\n- " + flags.join("\n- ") + "\n\nJaanch ho rahi hai\u2026"); scrollBot(typing, "bot"); }
  var out = await reply(text, wasGuard);
  justNamed = "";
  if (wasGuard) {
    var failed = /^(Abhi jawab nahi|Connection error|Jawab mein bahut|Server ne ajeeb|Khali jawab|Error:)/.test(out);
    if (flags.length && failed) out = "\u26A0\uFE0F Turant sanket:\n- " + flags.join("\n- ") + "\n\n" + out;
    applyGuard(false);
  }
  typing.remove();
  var el = add(out, "bot");
  if (!/^(Abhi jawab nahi|Connection error|Jawab mein bahut|Server ne ajeeb|Khali jawab|Error:)/.test(out)) attachFeedback(el, text, out);
  scrollBot(el, "bot");
  memory.history.push({role: "assistant", content: out});
  memory.history = memory.history.slice(-40);
  save();
});

/* ---- NAAM PAKADNA + SAMAY WALA SWAGAT ---- */
var NOT_NAMES = /^(hi+|hello|hey|hlo|hola|namaste|namaskar|yo|ok|okay|haan|han|ha|nahi|no|yes|kya|kuch|nothing|test|bol|bolo|fine|thik|theek|hai|hoon|hu|hun|he|main|mera|naam|name|kaise|kaisa|kaisi|kyun|kyu|kaun|kab|kahan|tum|tu|aap|thanks|thank|bye|wait|please|pls|bhai|yaar|dost|bro|sun|suno|batao|bata|ho|raha|rahi|kar|karo|kr|kuch|aur|bhi|abhi|acha|accha|achha)$/i;
function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }
function extractName(text, isFirst) {
  var t = text.trim().replace(/[.!?,]+$/g, "");
  var pats = [
    /^([A-Za-z\u0900-\u097F]{2,20})\s+(?:mera naam hai|hai mera naam|mera name hai|hoon main)$/i,
    /(?:mera (?:naam|name)(?: hai)?|my name is|name is|naam hai|call me|i am called|mujhe bulate hain)\s+([A-Za-z\u0900-\u097F]{2,20})/i
  ];
  for (var i = 0; i < pats.length; i++) {
    var m = t.match(pats[i]);
    if (m && !NOT_NAMES.test(m[1])) return cap(m[1]);
  }
  if (isFirst && /^[A-Za-z\u0900-\u097F]{2,20}( [A-Za-z\u0900-\u097F]{2,20})?$/.test(t) && !t.split(" ").some(function (w) { return NOT_NAMES.test(w); })) {
    return t.split(" ").map(cap).join(" ");
  }
  return "";
}
function greet() {
  var h = new Date().getHours(), n = memory.name;
  if (h >= 5 && h < 12) return "Subah ho gayi, " + n + ". Neend poori hui? Aaj ka kya plan hai?";
  if (h >= 12 && h < 17) return "Dopahar ho gayi, " + n + ". Din kaisa chal raha hai?";
  if (h >= 17 && h < 21) return "Shaam ho gayi, " + n + ". Aaj ka din kaisa gaya?";
  return "Raat ho gayi, " + n + ". Neend nahi aa rahi, ya kuch baat karni hai?";
}
function firstMessage() {
  return memory.name ? greet() : "Aa yaar, baith. Main QYAARO, yaaron ka yaar \u2615 Pehle bata, tera naam kya hai?";
}

document.getElementById("clear").addEventListener("click", function () {
  memory.history = []; save(); chat.innerHTML = "";
  document.body.classList.remove("compact");
  add(firstMessage(), "bot");
});

document.getElementById("fbexport").addEventListener("click", async function () {
  var data = JSON.stringify(loadFb(), null, 1);
  var n = loadFb().length;
  if (!n) { alert("Abhi koi feedback nahi hai. Kisi jawab par \uD83D\uDC4D ya \uD83D\uDC4E dabao."); return; }
  try { await navigator.clipboard.writeText(data); alert(n + " feedback copy ho gaye. Ab unhe chat mein paste kar do."); }
  catch (e) { prompt("Ye text copy karo:", data); }
});

if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }

/* ---- START ---- */
if (memory.history.length) {
  document.body.classList.add("compact");
  memory.history.forEach(function (m) { add(m.content, m.role === "user" ? "me" : "bot"); });
} else {
  add(firstMessage(), "bot");
}
</script>
